# Asks several processors what their approximate reciprocal answers, and compares each answer
# with the one the frames in this repository were drawn with.
#
# The oracle the software toolkit is written against is a set of pictures, and those pictures were
# drawn on an arm64 Mac running an x86_64 virtual machine under Rosetta. The instruction the
# rasteriser divides by is only specified to within an error bound, so Rosetta is free to answer
# differently from real hardware, and two makes of real hardware are free to disagree with each
# other. If they do disagree, no hosted runner can redraw those pictures, and the pictures cannot
# be checked anywhere but on the machine that drew them.
#
# Run this by hand from the Actions tab. It reports rather than fails, because a disagreement here
# is a fact to design around and not a fault to fix.
name: Approximate reciprocal

# A workflow_dispatch button only appears once the workflow is on the default branch, and this
# one is being asked from a side branch, so pushing the question is what asks it.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reciprocal.yml'
      - 'natives/src/main/native/reciprocal/**'
      - 'natives/src/main/native/sw3d/reciprocal-answers.h'

jobs:
  ask:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Hosted runners are a mix of processor makes, and which one a job lands on is not
        # chosen. Asking on several images samples more of that mix than asking on one. These are
        # all x86_64, because the question is about an x86 instruction.
        runner: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Say which processor answered
        run: |
          uname -m
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 'vendor_id' /proc/cpuinfo
          else
            sysctl -n machdep.cpu.brand_string
          fi

      - name: Ask it
        run: |
          cc -O2 -o capture natives/src/main/native/reciprocal/capture.c
          ./capture > answered.h
          wc -l answered.h

      - name: Compare with the answers the toolkit carries
        run: ./capture --compare

      - uses: actions/upload-artifact@v4
        with:
          name: answers-${{ matrix.runner }}
          path: answered.h
