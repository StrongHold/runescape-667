<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Viewer</title>
<style>
  :root {
    --bg: #f2f2f0;
    --fg: #1d1d1b;
    --muted: #6b6b66;
    --panel: rgba(255, 255, 255, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1c1e;
      --fg: #e8e8e4;
      --muted: #9a9a94;
      --panel: rgba(30, 31, 34, 0.85);
    }
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 system-ui, sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    max-width: 420px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--panel);
  }
  #panel p {
    margin: 6px 0 0;
    color: var(--muted);
  }
  body.dragging #panel {
    outline: 2px dashed var(--fg);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <input type="file" id="file" accept=".glb,.gltf">
  <label><input type="checkbox" id="wire"> wireframe</label>
  <select id="animation" hidden></select>
  <p id="status">Choose a .glb file, or drop one anywhere on the page.</p>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(2, 2, 3);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(3, 5, 4);
scene.add(sun);

const grid = new THREE.GridHelper(10, 10, 0x888888, 0x888888);
grid.material.transparent = true;
grid.material.opacity = 0.3;
scene.add(grid);

const status = document.getElementById('status');
const picker = document.getElementById('animation');
const loader = new GLTFLoader();
const clock = new THREE.Clock();
let model = null;
let mixer = null;
let clips = [];

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}

function frame(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  const centre = box.getCenter(new THREE.Vector3());
  controls.target.copy(centre);
  camera.position.copy(centre).add(new THREE.Vector3(0.6, 0.5, 0.8).multiplyScalar(size));
  camera.near = size / 100;
  camera.far = size * 100;
  camera.updateProjectionMatrix();
}

function setWireframe(on) {
  model?.traverse(node => {
    if (node.isMesh) {
      node.material.wireframe = on;
    }
  });
}

function play(index) {
  mixer.stopAllAction();
  if (clips[index]) {
    mixer.clipAction(clips[index]).play();
  }
}

function listAnimations(animations) {
  clips = animations;
  picker.replaceChildren(new Option('no animation', -1),
    ...clips.map((clip, index) => new Option(`${clip.name} (${clip.duration.toFixed(2)} s)`, index)));
  picker.hidden = clips.length === 0;
  picker.value = clips.length === 0 ? -1 : 0;
  play(Number(picker.value));
}

async function open(file) {
  try {
    const gltf = await loader.parseAsync(await file.arrayBuffer(), '');
    if (model) {
      scene.remove(model);
    }
    model = gltf.scene;
    scene.add(model);
    mixer = new THREE.AnimationMixer(model);
    listAnimations(gltf.animations);
    setWireframe(document.getElementById('wire').checked);
    frame(model);

    let triangles = 0;
    model.traverse(node => {
      if (node.isMesh) {
        triangles += node.geometry.attributes.position.count / 3;
      }
    });
    status.textContent = `${file.name}: ${triangles} triangles. One grid square is one tile.`;
  } catch (failure) {
    status.textContent = `${file.name} could not be read: ${failure.message}`;
  }
}

document.getElementById('file').addEventListener('change', event => {
  if (event.target.files[0]) {
    open(event.target.files[0]);
  }
});
document.getElementById('wire').addEventListener('change', event => setWireframe(event.target.checked));
picker.addEventListener('change', () => play(Number(picker.value)));

window.addEventListener('dragover', event => {
  event.preventDefault();
  document.body.classList.add('dragging');
});
window.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
window.addEventListener('drop', event => {
  event.preventDefault();
  document.body.classList.remove('dragging');
  if (event.dataTransfer.files[0]) {
    open(event.dataTransfer.files[0]);
  }
});

window.addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => {
  mixer?.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
